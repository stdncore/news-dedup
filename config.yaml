# Configuration for news ingestion and deduplication.

ingest:
  # Public telegram channels (username with or without @, or t.me/<name>).
  channels:
    - "@tass_agency"
    - "@rbc_news"
    - "@interfax_russia"
    - "@kommersant"
    - "@vedomosti"
    - "@rian_ru"
    - "@lentaru"
    - "@bfmru"
    - "@iz_ru"
    - "@aif_ru"
    - "@mk_ru"
    - "@fontankaspb"
  # How many recent messages to pull per channel on the first pass.
  history_limit: 500
  db_path: "news.db"

dedup:
  db_path: "news.db"

  # Embedding model (sentence-transformers).
  model: "deepvk/USER-bge-m3"
  # Query prefix for bge models (USER-bge-m3 expects an instruction prefix).
  query_prefix: ""
  # How many characters of text to feed into the model (after the title).
  max_chars: 1500
  batch_size: 256        # bigger batch -> better CPU utilization at 100k

  # Incremental embeddings cache (keyed by id, atomic write per chunk).
  # Survives a crash during a multi-hour 100k run. Empty -> no cache.
  embeddings_cache: "embeddings_cache.npz"

  # Lexical pre-filter (MinHash/LSH).
  prefilter:
    enabled: true
    num_perm: 256
    jaccard_threshold: 0.7
    shingle_size: 5   # character n-gram size (in words)

  # ANN + threshold.
  ann:
    top_k: 50            # neighbors per news item (50: max cluster in test=102 >> 20, margin against fragmentation)
    nlist: 256           # IVFFlat: number of cells (>50k); auto-shrunk to fit n
    nprobe: 32           # IVFFlat: how many cells to probe during search
  # Cosine threshold for an edge between news items (CALIBRATE on your own data).
  # 0.80: with Louvain keeps recall=1.0 on the labeled set, cuts weak bridges.
  # 0.78: optimum on 259 labeled pairs (tau-sweep + Louvain res=1.5).
  cosine_threshold: 0.78
  # Time window for blocking: edges only between news items within N hours of each other.
  # 72h → 24h: removes daily boilerplate roundups (COVID, N drones shot down)
  # that have high cosine similarity but are different events. TPs lost at 24h are
  # borderline labels (11 days apart, different incidents).
  time_window_hours: 24

  # Edge-graph clustering: louvain | connected_components.
  # Louvain cuts transitive bridges. On 259 pairs: F1=0.820, P=0.780, R=0.865.
  clustering: "louvain"
  louvain_resolution: 1.5

  # Choice of the canonical news item within a cluster.
  canonical: "earliest"   # earliest | longest

  seed: 42
  output: "clusters.json"
